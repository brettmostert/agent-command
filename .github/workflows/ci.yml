# PR checks. Every PR runs every check, so the required checks always report.
# They run on GitHub-hosted runners: the repo is public, so a PR from a fork
# runs nowhere but there. Release PRs only change the version and changelog,
# and the release gate runs every check on the same commit, so the jobs skip
# them.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    if: "!startsWith(github.head_ref, 'release-please--')"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/macos-tools
      - run: make lint

  swift:
    runs-on: macos-26
    if: "!startsWith(github.head_ref, 'release-please--')"
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/macos-tools
        with:
          metal: "true"
      - name: scan the Swift code
        run: make swift-scan
      - name: speech engine unit tests + release build
        run: make speech-test speech-helper

  vuln:
    runs-on: macos-26
    if: "!startsWith(github.head_ref, 'release-please--')"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: ./.github/actions/macos-tools
      - run: make vuln secrets

  # The macOS-only steps (snapshot, brew formula check).
  macos:
    runs-on: macos-26
    if: "!startsWith(github.head_ref, 'release-please--')"
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs tags/history
      - uses: ./.github/actions/macos-tools
        with:
          ghostty: "true"
      - name: test (race + coverage gate)
        run: make test
      - name: fuzz (short)
        run: make fuzz FUZZTIME=15s
      - name: test with libghostty, and test the app
        run: make test-vt test-app
      - name: build the app
        run: scripts/build-app.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-darwin-all
          path: dist/*_darwin_all.tar.gz
          retention-days: 3
