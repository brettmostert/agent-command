# PR checks, also run on main. Every PR runs every check, so the required checks always report.
# They run on GitHub-hosted runners: the repo is public, so a PR from a fork
# runs nowhere but there. Release PRs only change the version and changelog,
# and the release gate runs every check on the same commit, so the jobs skip
# them.
name: ci

on:
  pull_request:
  # Runs on main too: GitHub only shares caches from the default branch, so
  # this is what lets PRs reuse the Ghostty build. It also checks main after
  # each merge.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    if: "!startsWith(github.head_ref, 'release-please--')"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/macos-tools
      - run: make lint

  swift:
    runs-on: macos-26
    if: "!startsWith(github.head_ref, 'release-please--')"
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/macos-tools
        with:
          metal: "true"
      - name: scan the Swift code
        run: make swift-scan
      - name: speech engine unit tests + release build
        run: make speech-test speech-helper

  vuln:
    runs-on: macos-26
    if: "!startsWith(github.head_ref, 'release-please--')"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: ./.github/actions/macos-tools
      - run: make vuln secrets

  # The macOS-only steps (snapshot, brew formula check).
  macos:
    runs-on: macos-26
    if: "!startsWith(github.head_ref, 'release-please--')"
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs tags/history
      - uses: ./.github/actions/macos-tools
        with:
          ghostty: "true"
      - name: test (race + coverage gate)
        run: make test
      - name: fuzz (short)
        run: make fuzz FUZZTIME=15s
      - name: test with libghostty, and test the app
        run: make test-vt test-app
      # Signed the way a release signs it, with a throwaway certificate, so a
      # release is never the first time signing runs on a fresh runner.
      - name: build the app, signed with a throwaway certificate
        run: |
          scripts/create-signing-cert.sh "$RUNNER_TEMP/cert" >/dev/null
          # What made it, should importing it fail (the certificate is a throwaway).
          command -v openssl base64; openssl version
          wc -c "$RUNNER_TEMP/cert/signing.p12" "$RUNNER_TEMP/cert/signing.p12.base64"
          openssl pkcs12 -info -noout -in "$RUNNER_TEMP/cert/signing.p12" -passin "file:$RUNNER_TEMP/cert/signing.password" 2>&1 | head -5 || true
          SIGNING_P12="$(cat "$RUNNER_TEMP/cert/signing.p12.base64")" \
          SIGNING_PASSWORD="$(cat "$RUNNER_TEMP/cert/signing.password")" \
            scripts/import-signing-cert.sh "$RUNNER_TEMP/signing.keychain-db" > "$RUNNER_TEMP/signing.env"
          rm -rf "$RUNNER_TEMP/cert"
          set -a; . "$RUNNER_TEMP/signing.env"; set +a
          ACMD_SIGN_KEYCHAIN="$KEYCHAIN" scripts/build-app.sh
          codesign --verify --strict "dist/Agent Command.app"
          codesign -dv "dist/Agent Command.app" 2>&1 | grep -F "Authority=Agent Command Self-Signed"
          security delete-keychain "$KEYCHAIN"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-darwin-all
          path: dist/*_darwin_all.tar.gz
          retention-days: 3
