# CodeQL code scanning, in place of GitHub's default setup. That one's Swift
# autobuild couldn't build the app (it has no Ghostty library), so it scanned
# the speech helper's dependencies instead: about 40 minutes a PR, and none of
# it the app's code.
#
# Here Swift builds the app on the cached Ghostty build, and the speech helper's
# own code (SpeechCore, which has no dependencies). The helper's executable needs
# MLX, a long build of other people's code, so it's scanned on main and weekly.
# Go is analyzed for macOS (GOOS=darwin), so its darwin-only files count, on a
# Linux runner, which keeps the Mac runners free.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Release PRs and commits only change the version and changelog.
    if: "!startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release')"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.language == 'swift' && 75 || 20 }}
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: go
            build-mode: autobuild
            runner: ubuntu-latest
          - language: swift
            build-mode: manual
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Before CodeQL starts watching: the Ghostty build is Zig, not ours to scan.
      - if: matrix.language == 'swift'
        uses: ./.github/actions/macos-tools
        with:
          ghostty: "true"
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.language == 'go'
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        env:
          GOOS: darwin
          CGO_ENABLED: "0"
      - name: build the app and the speech helper's own code
        if: matrix.language == 'swift'
        run: |
          # What the tracer runs the build as: the Ghostty library is arm64 only.
          echo "arch: $(uname -m)"; swift -print-target-info | grep -m1 '"triple"'
          swift build --package-path app --triple arm64-apple-macosx26.0
          swift build --package-path helpers/acmd-speech --target SpeechCore --triple arm64-apple-macosx26.0
      - name: build the speech helper with MLX (main and weekly)
        if: matrix.language == 'swift' && github.event_name != 'pull_request'
        run: swift build --package-path helpers/acmd-speech --triple arm64-apple-macosx26.0
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
