# PR titles become squash-commit messages, which release-please reads, so
# they must be Conventional Commits. Runs even for docs-only PRs.
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: [self-hosted, acmd]
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          # Dependabot always writes "Bump", and can't be told otherwise.
          subjectPattern: ^((?![A-Z]).+|Bump .+)$
          subjectPatternError: |
            The subject "{subject}" should start with a lowercase letter,
            e.g. "feat: add group picker".
