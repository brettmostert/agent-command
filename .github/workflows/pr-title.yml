# PR titles become squash-commit messages, which release-please reads, so
# they must be Conventional Commits. Runs on every PR.
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          # Dependabot always writes "Bump", and can't be told otherwise.
          subjectPattern: ^((?![A-Z]).+|Bump .+)$
          subjectPatternError: |
            The subject "{subject}" should start with a lowercase letter,
            e.g. "feat: add group picker".
