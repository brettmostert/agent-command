# Release pipeline:
#   1. release-please keeps a release PR open; merging it tags vX.Y.Z and
#      creates the (private) GitHub Release.
#   2. In the same workflow (tags created by tokens don't trigger workflows):
#      gate -> build and sign the app -> publish it to the public tap -> cask.
# Nothing is published if the gate fails.
name: release

on:
  push:
    branches: [main]


permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: brettmostert
          repositories: agent-command
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Gate + publish.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
      TAP_REPO: brettmostert/homebrew-tap
      TAP_TAG: agent-command-${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: brettmostert
          repositories: agent-command,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: ./.github/actions/macos-tools
        with:
          ghostty: "true"

      # ---- gate: re-run every check on the exact release commit ----
      - name: gate - lint, test, vuln, build
        run: make ci
      - name: gate - fuzz
        run: make fuzz FUZZTIME=30s

      # ---- build ----

      - name: gate - test with libghostty, and test the app
        run: make test-vt test-app

      - name: import the signing certificate
        env:
          SIGNING_P12: ${{ secrets.ACMD_SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.ACMD_SIGNING_PASSWORD }}
        # Sets KEYCHAIN and ACMD_SIGN_IDENTITY (the certificate's SHA-1).
        run: scripts/import-signing-cert.sh "$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"

      - name: build and sign the app
        env:
          ACMD_SIGN_KEYCHAIN: ${{ env.KEYCHAIN }}
          ACMD_VERSION: ${{ needs.release-please.outputs.version }}
        run: scripts/build-app.sh

      - name: check the app
        run: |
          codesign --verify --strict "dist/Agent Command.app"
          codesign -dvv "dist/Agent Command.app" 2>&1 | grep -F "Authority=Agent Command Self-Signed"
          "dist/Agent Command.app/Contents/MacOS/agent-command" version | grep -F "$VERSION"
          "dist/Agent Command.app/Contents/MacOS/acmd-speech" --version

      # ---- publish ----
      - name: publish the app to the public tap
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          (cd dist && shasum -a 256 AgentCommand.zip > checksums.txt)
          gh release create "$TAP_TAG" --repo "$TAP_REPO" --title "agent-command $VERSION" \
            --notes-file notes.md dist/AgentCommand.zip dist/checksums.txt

      - name: commit the cask to the tap
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          sha=$(shasum -a 256 dist/AgentCommand.zip | awk '{print $1}')
          scripts/render-cask.sh "$VERSION" "$sha" build/agent-command.rb
          bot_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Casks
          cp build/agent-command.rb tap/Casks/agent-command.rb
          cd tap
          git rm -q --ignore-unmatch Formula/agent-command.rb
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add Casks/agent-command.rb
          git commit -m "agent-command ${VERSION}"
          git push origin HEAD

      - name: remove the signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi

      - name: mark release as failed
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "[FAILED] $TAG" \
            --notes "$(printf '> **Release failed; nothing was published to the tap.** See %s. The fix ships as the next patch version.\n\n%s' "$run_url" "$body")"
