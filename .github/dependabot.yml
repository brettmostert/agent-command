version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      go-modules:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope # -> "chore(deps): ..."

  # The speech engine's packages, pinned in Package.resolved. A new mlx-audio-swift
  # needs the offline install test again, as staying offline depends on
  # how it works inside.
  - package-ecosystem: swift
    directory: /helpers/acmd-speech
    schedule:
      interval: weekly
      day: monday
    groups:
      swift-packages:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope # -> "chore(deps): ..."

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope # -> "ci(deps): ..."
